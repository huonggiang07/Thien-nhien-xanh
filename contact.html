<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá Thiên Nhiên - Liên Hệ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Bỏ qua đến Nội dung chính</a>

    <header>
        <nav class="navbar">
            <div class="logo">Thiên Nhiên Xanh</div>
            <ul class="nav-links">
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="gallery.html">Thư Viện Ảnh</a></li>
                <li><a href="contact.html" class="active">Liên Hệ</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <h1>Liên Hệ Với Chúng Tôi</h1>
        <form class="contact-form">
            <label for="fullname">Họ và tên:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Thông điệp:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Gửi Thông Tin</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Bản quyền thuộc về Dự án Thiên Nhiên.</p>
    </footer>
</body>
</html>
